# Rebuild every image, from the pinned sources and lockfiles, under one tag.
# Manual only. Each image is built hermetically (hack/prefetch.sh, then
# hack/build.sh with no network), the way Konflux builds Red Hat's images, so
# a run is reproducible: the same commit of this repo gives the same inputs.
#
# Fresh upstream code is not fetched here any more. To move an image forward,
# bump its submodule (and/or its *.in files), run hack/lock.sh <image>, and
# commit the new lockfiles; then run build-all.
#
# One run, one tag: every image gets <date>-r<run number> (plus :latest on
# main). The run number keeps the tag unique.

name: build-all

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        required: false
        type: choice
        default: "linux/amd64,linux/arm64"
        options:
          - "linux/amd64,linux/arm64"
          - "linux/amd64"

# Two overlapping runs would race each other for :latest.
concurrency:
  group: build-all
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  tag:
    name: tag this run
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          tag="$(date -u +%Y%m%d)-r${GITHUB_RUN_NUMBER}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "**Tag:** \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

  receptor:
    needs: tag
    uses: ./.github/workflows/build-image.yml
    permissions: { contents: read, packages: write }
    with: { image: receptor, platforms: "${{ inputs.platforms }}", tag: "${{ needs.tag.outputs.tag }}" }
  gateway:
    needs: tag
    uses: ./.github/workflows/build-image.yml
    permissions: { contents: read, packages: write }
    with: { image: gateway, platforms: "${{ inputs.platforms }}", tag: "${{ needs.tag.outputs.tag }}" }
  controller:
    needs: tag
    uses: ./.github/workflows/build-image.yml
    permissions: { contents: read, packages: write }
    with: { image: controller, platforms: "${{ inputs.platforms }}", tag: "${{ needs.tag.outputs.tag }}" }
  hub:
    needs: tag
    uses: ./.github/workflows/build-image.yml
    permissions: { contents: read, packages: write }
    with: { image: hub, platforms: "${{ inputs.platforms }}", tag: "${{ needs.tag.outputs.tag }}" }
  eda:
    needs: tag
    uses: ./.github/workflows/build-image.yml
    permissions: { contents: read, packages: write }
    with: { image: eda, platforms: "${{ inputs.platforms }}", tag: "${{ needs.tag.outputs.tag }}" }
  ee-minimal:
    needs: tag
    uses: ./.github/workflows/build-image.yml
    permissions: { contents: read, packages: write }
    with: { image: ee-minimal, platforms: "${{ inputs.platforms }}", tag: "${{ needs.tag.outputs.tag }}" }
  de-minimal:
    needs: tag
    uses: ./.github/workflows/build-image.yml
    permissions: { contents: read, packages: write }
    with: { image: de-minimal, platforms: "${{ inputs.platforms }}", tag: "${{ needs.tag.outputs.tag }}" }
  # Built FROM the de-minimal this run produced, as Red Hat's de-supported is
  # built from its de-minimal.
  de-supported:
    needs: [tag, de-minimal]
    uses: ./.github/workflows/build-image.yml
    permissions: { contents: read, packages: write }
    with:
      image: de-supported
      platforms: ${{ inputs.platforms }}
      tag: ${{ needs.tag.outputs.tag }}
      build_args: |
        EE_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/ace-de-minimal:${{ needs.tag.outputs.tag }}
  git-server:
    needs: tag
    uses: ./.github/workflows/build-image.yml
    permissions: { contents: read, packages: write }
    with: { image: git-server, platforms: "${{ inputs.platforms }}", tag: "${{ needs.tag.outputs.tag }}" }
