# Reusable build for every image in this repo.
#
# Callers pass the directory name; everything else is uniform. Each platform
# builds and pushes BY DIGEST, then a merge job assembles one multi-arch
# manifest — the only way to get a real manifest list out of parallel runners
# on different architectures.
#
# Two build paths, chosen per image:
#   prefetched  the image has a hermeto.json. Built the way Konflux builds Red
#             Hat's images: hack/prefetch.sh fetches every dependency, then
#             hack/build.sh builds from the prefetch. Both run inside the
#             hack/ci image, because they need a newer podman than the
#             runner has (see hack/ci/Containerfile).
#   legacy    no hermeto.json yet: the original buildx build, which clones
#             upstream and installs from the internet. Images move to the
#             prefetched path one at a time.

name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: "Directory name, which is also the image name suffix"
        required: true
        type: string
      build_args:
        description: "Newline-separated ARG=value overrides"
        required: false
        type: string
        default: ""
      platforms:
        description: "Comma-separated platforms to build"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      tag:
        description: "Tag to publish besides :latest (blank = <date>-<commit>)"
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ inputs.image }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Choose the build path
        id: mode
        run: |
          if [ -f "${{ inputs.image }}/hermeto.json" ]; then
            echo "prefetched=true" >> "$GITHUB_OUTPUT"
          else
            echo "prefetched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip platforms the caller did not ask for
        id: want
        run: |
          case ",${{ inputs.platforms }}," in
            *",${{ matrix.platform }},"*) echo "build=true"  >> "$GITHUB_OUTPUT" ;;
            *)                            echo "build=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Prepare names
        if: steps.want.outputs.build == 'true'
        run: |
          owner="${{ github.repository_owner }}"
          echo "IMAGE_NAME=${owner,,}/ace-${{ inputs.image }}" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_TAG=${platform//\//-}" >> "$GITHUB_ENV"

      # Records which upstream commit actually went in, so `podman inspect` on
      # any published tag answers "what is in this?". That is the override when
      # the caller passed one (build-all always does), else the Containerfile's pin.
      - name: Resolve the upstream ref that was built
        if: steps.want.outputs.build == 'true' && steps.mode.outputs.prefetched == 'false'
        id: src
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          pin=$(grep -hoE '^ARG [A-Z_]*REF=[0-9a-f]{40}' "${{ inputs.image }}/Containerfile" | head -1 || true)
          name=${pin#ARG }; name=${name%%=*}
          sha=${pin##*=}
          if [ -n "$name" ]; then
            override=$(printf '%s\n' "$BUILD_ARGS" | sed -nE "s/^[[:space:]]*${name}=([0-9a-f]{40})[[:space:]]*$/\1/p" | head -1)
            sha=${override:-$sha}
          fi
          echo "sha=${sha:-unpinned}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.want.outputs.build == 'true' && steps.mode.outputs.prefetched == 'false'

      - uses: docker/login-action@v3
        if: steps.want.outputs.build == 'true' && steps.mode.outputs.prefetched == 'false'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        if: steps.want.outputs.build == 'true' && steps.mode.outputs.prefetched == 'false'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.image }}
          file: ${{ inputs.image }}/Containerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build_args }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            ace.source.ref=${{ steps.src.outputs.sha }}
          # Registry cache, not type=gha: eight images across two architectures
          # would thrash the 10 GB Actions cache budget continuously.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_TAG }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_TAG }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: steps.want.outputs.build == 'true' && steps.mode.outputs.prefetched == 'false'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # ---- prefetched path --------------------------------------------------
      - name: Check out the image's upstream sources (its submodules)
        if: steps.want.outputs.build == 'true' && steps.mode.outputs.prefetched == 'true'
        run: |
          paths=$(git config --file .gitmodules --get-regexp '^submodule\.${{ inputs.image }}/.*\.path$' | awk '{print $2}')
          [ -z "$paths" ] || git submodule update --init -- $paths

      - name: Prefetch, build, push by digest
        if: steps.want.outputs.build == 'true' && steps.mode.outputs.prefetched == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          src_ref=$(git -C "${{ inputs.image }}/src" rev-parse HEAD 2>/dev/null || echo none)
          # The caller's ARG=value lines become --build-arg flags (build-all
          # uses this to point de-supported at the de-minimal it just built).
          build_args=""
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            [ -n "$line" ] && build_args="$build_args --build-arg $line"
          done <<< "$BUILD_ARGS"
          docker build -q -t ace-ci -f hack/ci/Containerfile hack/ci
          docker run --rm --privileged -v "$PWD:/repo" -e GH_TOKEN -e ACE_OUT=/var/tmp/ace-out ace-ci sh -euc '
            git config --global --add safe.directory "*"
            # PyPI times out now and then; a prefetch starts clean, so retry it.
            for try in 1 2 3; do
              hack/prefetch.sh "${{ inputs.image }}" && break
              [ "$try" = 3 ] && exit 1
              echo "prefetch failed, retrying"; sleep 30
            done
            hack/build.sh "${{ inputs.image }}" ci -- '"$build_args"' \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.licenses=Apache-2.0" \
              --label "ace.source.ref='"$src_ref"'"
            podman push --creds "${{ github.actor }}:$GH_TOKEN" --digestfile /repo/.digest \
              "localhost/ace-${{ inputs.image }}:ci" \
              "docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ env.PLATFORM_TAG }}"
          '
          mkdir -p /tmp/digests
          digest=$(cat .digest)
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.build == 'true'
        with:
          name: digests-${{ inputs.image }}-${{ env.PLATFORM_TAG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ inputs.image }} (manifest)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          owner="${{ github.repository_owner }}"
          echo "image=${owner,,}/ace-${{ inputs.image }}" >> "$GITHUB_OUTPUT"
          # build-all passes one tag for the whole run; a single-image build
          # falls back to <date>-<commit of this repo>.
          tag="${{ inputs.tag }}"
          echo "tag=${tag:-$(date -u +%Y%m%d)-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Only main moves :latest; a build from a branch gets its dated tag only.
          latest=""
          [ "$GITHUB_REF" = "refs/heads/main" ] && latest="-t ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:latest"
          docker buildx imagetools create $latest \
            -t ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            $(printf '${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
