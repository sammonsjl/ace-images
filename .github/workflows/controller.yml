name: build-controller

# Hermetic where controller/hermeto.json exists: the upstream source is pinned by
# submodule and every dependency by the lockfiles in controller/. To refresh, bump
# the submodule and/or the *.in files, run hack/lock.sh controller, and push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "controller/**"
      - "hack/**"
      - ".github/workflows/controller.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: controller
