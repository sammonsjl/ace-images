name: build-controller

on:
  workflow_dispatch:
    inputs:
      awx_ref:
        description: "ansible/awx git ref (blank = Containerfile default)"
        required: false
        default: ""
      awx_version:
        description: "version stamped into the sdist (blank = Containerfile default)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "controller/**"
      - ".github/workflows/controller.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: controller
      build_args: |
        ${{ inputs.awx_ref && format('AWX_REF={0}', inputs.awx_ref) || '' }}
        ${{ inputs.awx_version && format('AWX_VERSION={0}', inputs.awx_version) || '' }}
