name: build-de-supported

# Hermetic where de-supported/hermeto.json exists: the upstream source is pinned by
# submodule and every dependency by the lockfiles in de-supported/. To refresh, bump
# the submodule and/or the *.in files, run hack/lock.sh de-supported, and push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "de-supported/**"
      - "hack/**"
      - ".github/workflows/de-supported.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: de-supported
      # Built FROM ace-de-minimal; on its own it takes de-minimal's :latest.
