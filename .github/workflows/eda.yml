name: build-eda

on:
  workflow_dispatch:
    inputs:
      eda_ref:
        description: "ansible/eda-server git ref (blank = Containerfile default)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "eda/**"
      - ".github/workflows/eda.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: eda
      build_args: |
        ${{ inputs.eda_ref && format('EDA_REF={0}', inputs.eda_ref) || '' }}
