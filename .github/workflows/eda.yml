name: build-eda

# Prefetched where eda/hermeto.json exists: the upstream source is pinned by
# submodule and every dependency by the lockfiles in eda/. To refresh, bump
# the submodule and/or the *.in files, run hack/lock.sh eda, and push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "eda/**"
      - "hack/**"
      - ".github/workflows/eda.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: eda
