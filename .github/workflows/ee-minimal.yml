name: build-ee-minimal

on:
  workflow_dispatch:
    inputs:
      ansible_core_version:
        description: "ansible-core version (blank = Containerfile default)"
        required: false
        default: ""
      ansible_runner_version:
        description: "ansible-runner version (blank = Containerfile default)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "ee-minimal/**"
      - ".github/workflows/ee-minimal.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ee-minimal
      build_args: |
        ${{ inputs.ansible_core_version && format('ANSIBLE_CORE_VERSION={0}', inputs.ansible_core_version) || '' }}
        ${{ inputs.ansible_runner_version && format('ANSIBLE_RUNNER_VERSION={0}', inputs.ansible_runner_version) || '' }}
