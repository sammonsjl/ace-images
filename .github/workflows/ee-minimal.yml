name: build-ee-minimal

# Hermetic where ee-minimal/hermeto.json exists: the upstream source is pinned by
# submodule and every dependency by the lockfiles in ee-minimal/. To refresh, bump
# the submodule and/or the *.in files, run hack/lock.sh ee-minimal, and push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ee-minimal/**"
      - "hack/**"
      - ".github/workflows/ee-minimal.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ee-minimal
