name: build-gateway

# Hermetic where gateway/hermeto.json exists: the upstream source is pinned by
# submodule and every dependency by the lockfiles in gateway/. To refresh, bump
# the submodule and/or the *.in files, run hack/lock.sh gateway, and push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "hack/**"
      - ".github/workflows/gateway.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: gateway
