name: build-gateway

on:
  workflow_dispatch:
    inputs:
      jewel_ref:
        description: "ansible/jewel git ref (blank = Containerfile default)"
        required: false
        default: ""
      ansible_ui_ref:
        description: "ansible/ansible-ui git ref (blank = Containerfile default)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: gateway
      build_args: |
        ${{ inputs.jewel_ref && format('JEWEL_REF={0}', inputs.jewel_ref) || '' }}
        ${{ inputs.ansible_ui_ref && format('ANSIBLE_UI_REF={0}', inputs.ansible_ui_ref) || '' }}
