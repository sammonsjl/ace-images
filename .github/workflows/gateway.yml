name: build-gateway

on:
  workflow_dispatch:
    inputs:
      jewel_ref:
        description: "ansible/jewel git ref (blank = Containerfile default)"
        required: false
        default: ""
      ansible_ui_ref:
        description: "ansible/ansible-ui git ref (blank = Containerfile default)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ace-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
          build-args: |
            ${{ inputs.jewel_ref && format('JEWEL_REF={0}', inputs.jewel_ref) || '' }}
            ${{ inputs.ansible_ui_ref && format('ANSIBLE_UI_REF={0}', inputs.ansible_ui_ref) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
