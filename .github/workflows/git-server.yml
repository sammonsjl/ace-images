name: build-git-server

# Hermetic where git-server/hermeto.json exists: the upstream source is pinned by
# submodule and every dependency by the lockfiles in git-server/. To refresh, bump
# the submodule and/or the *.in files, run hack/lock.sh git-server, and push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "git-server/**"
      - "hack/**"
      - ".github/workflows/git-server.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: git-server
