name: build-git-server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "git-server/**"
      - ".github/workflows/git-server.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: git-server
