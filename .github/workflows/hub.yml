name: build-hub

# Hermetic where hub/hermeto.json exists: the upstream source is pinned by
# submodule and every dependency by the lockfiles in hub/. To refresh, bump
# the submodule and/or the *.in files, run hack/lock.sh hub, and push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "hack/**"
      - ".github/workflows/hub.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: hub
