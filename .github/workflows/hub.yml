name: build-hub

on:
  workflow_dispatch:
    inputs:
      galaxy_ng_ref:
        description: "ansible/galaxy_ng git ref (blank = Containerfile default)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "hub/**"
      - ".github/workflows/hub.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ace-hub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push hub image
        uses: docker/build-push-action@v6
        with:
          context: hub
          file: hub/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
          build-args: |
            ${{ inputs.galaxy_ng_ref && format('GALAXY_NG_REF={0}', inputs.galaxy_ng_ref) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
