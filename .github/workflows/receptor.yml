name: build-receptor

on:
  workflow_dispatch:
    inputs:
      receptor_ref:
        description: "ansible/receptor git ref (blank = Containerfile default)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "receptor/**"
      - ".github/workflows/receptor.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: receptor
      build_args: |
        ${{ inputs.receptor_ref && format('RECEPTOR_REF={0}', inputs.receptor_ref) || '' }}
