name: build-receptor

# Hermetic: receptor/src is a submodule pinned to the release tag, and the
# lockfiles in receptor/ decide every dependency. To move to a new release,
# bump the submodule, run hack/lock.sh receptor, and push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "receptor/**"
      - "hack/**"
      - ".github/workflows/receptor.yml"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: receptor
