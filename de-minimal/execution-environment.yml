# The ACE minimal decision environment: what rulebooks need and nothing more
# (python, ansible-core, ansible-runner, ansible-rulebook and the Drools
# engine it drives through a JVM). Red Hat ships the same split:
# de-supported-rhel9 is built FROM a de-minimal-rhel9, and so is
# ace-de-supported FROM this. Generated into a build context by
# hack/ee-create.sh de-minimal; built from a prefetch like every other image.
version: 3

images:
  base_image:
    name: registry.access.redhat.com/ubi9/ubi-minimal:9.8

dependencies:
  python_interpreter:
    package_system: python3.12
    python_path: /usr/bin/python3.12
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  # The complete pinned list (lock-post.sh), installed with --no-deps.
  python: requirements-full.in
  system: bindep.txt

options:
  package_manager_path: /usr/bin/microdnf
  # The final stage starts from the base image itself (hack/ee-create.sh), so
  # the check ansible-builder would run there has no /output/scripts to run.
  skip_ansible_check: true
  container_init:
    package_pip: dumb-init==1.2.5.post1

additional_build_steps:
  # requirements-full.in is complete, so pip resolves nothing: see lock-post.sh.
  # An ARG, not an ENV, so it does not stay in the image.
  prepend_builder:
    - ARG PIP_OPTS=--no-deps
    # jpy (under drools_jpy) builds against a JDK and finds it only through
    # JAVA_HOME. The JDK itself comes from bindep.txt's compile profile.
    - ENV JAVA_HOME=/usr/lib/jvm/java-17-openjdk
  prepend_final:
    - ARG PIP_OPTS=--no-deps
  # The prefetch holds sdists where PyPI has no wheel, so the base stage's install of
  # ansible-core and ansible-runner compiles C; the base stage never reaches
  # the final image (hack/ee-create.sh).
  prepend_base:
    - RUN $PKGMGR install --nodocs -y gcc gcc-c++ python3.12-devel libffi-devel openssl-devel rust cargo && $PKGMGR clean all
  # The final stage starts from ubi-minimal itself, so the entrypoint
  # ansible-builder put in the base stage is brought along here.
  append_final:
    - COPY _build/scripts/entrypoint /opt/builder/bin/entrypoint
    - >-
      ENV DESCRIPTION="ACE minimal decision environment: ansible-rulebook and
      its Drools engine" container=oci
    - >-
      LABEL name="ace-de-minimal" summary="${DESCRIPTION}" description="${DESCRIPTION}"
      io.k8s.description="${DESCRIPTION}" io.k8s.display-name="ACE minimal decision environment"
      io.openshift.tags="ace,automation,decision-environment" maintainer="Jamie Sammons"
