# Every RPM any stage installs. Resolved against ubi9-minimal.
contentOrigin:
  repofiles:
    - ../hack/ubi.repo
context:
  image: registry.access.redhat.com/ubi9/ubi-minimal:9.8
arches:
  - x86_64
  - aarch64
packages:
  - python3.12
  - python3.12-pip
  - java-17-openjdk-headless
  - glibc-langpack-en
  - libpq
  - gcc
  - gcc-c++
  - python3.12-devel
  - java-17-openjdk-devel
  - libpq-devel
  - libffi-devel
  - openssl-devel
  - rust
  - cargo
