# AWX nginx location rules (included inside the server block). From AWX's own
# tools/docker-compose nginx.locations.conf (Apache-2.0): /api and everything
# else -> uwsgi; websockets -> daphne; static from the collected static dir.
location /static { alias /var/lib/awx/public/static/; }

location ~ ^(/websocket/|/api/websocket/) {
    proxy_pass http://daphne;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $http_host;
    proxy_redirect off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

location / {
    uwsgi_read_timeout 120s;
    uwsgi_pass uwsgi;
    include /etc/nginx/uwsgi_params;
    error_page 502 = @fallback;
}

location @fallback {
    proxy_pass http://runserver;
    proxy_set_header Host $http_host;
}
