# Minimal AWX web nginx config, http-only on :8013 (the image ships only a stock
# :80 default server). pid/logs go to writable paths since the container runs as
# uid 1000 (rootless). Upstreams pinned to 127.0.0.1 so nginx doesn't try IPv6
# (uwsgi/daphne listen on IPv4). Based on AWX's own tools/docker-compose config.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    sendfile on;

    upstream uwsgi     { server 127.0.0.1:8050; }
    upstream runserver { server 127.0.0.1:8052; }
    upstream daphne    { server 127.0.0.1:8051; }

    server {
        listen 8013 default_server;
        server_name _;
        keepalive_timeout 65;
        include /etc/nginx/conf.d/*.conf;
    }
}
