# Every RPM the build installs, in any stage. Resolved against ubi9-minimal,
# the smallest base used, so the lock also covers what ubi9 (the builder
# stages' base) already has.
contentOrigin:
  repofiles:
    - ../hack/ubi.repo
context:
  image: registry.access.redhat.com/ubi9/ubi-minimal:9.8
arches:
  - x86_64
  - aarch64
packages:
  # wheels and go stages
  - golang
  - gcc
  - binutils
  - python3.12-devel
  # runtime, as receptor-rhel9 installs it
  - python3.12
  - python3.12-pip
  - podman-remote
